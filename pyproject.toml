[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bmv"
version = "0.2.0"
description = "现代化、安全、基于管道链的批量文件重命名与整理工具"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "typer>=0.12.0",
]

[project.scripts]
bmv = "bmv.cli:app"
